version: "3.9"

networks:
  financial-streaming:
    driver: bridge

volumes:
  kafka-data:
  zookeeper-data:
  postgres-data:
  minio-data:
  mlflow-data:
  iceberg-warehouse:

services:
  # ==================== ZOOKEEPER ====================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    hostname: zookeeper
    container_name: zookeeper
    networks:
      - financial-streaming
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== KAFKA ====================
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    hostname: kafka
    container_name: kafka
    networks:
      - financial-streaming
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data

  # ==================== KAFKA UI ====================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    networks:
      - financial-streaming
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      kafka:
        condition: service_started

  # ==================== MINIO (S3) ====================
  minio:
    image: minio/minio:latest
    hostname: minio
    container_name: minio
    networks:
      - financial-streaming
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ==================== MINIO INIT ====================
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    networks:
      - financial-streaming
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set myminio http://minio:9000 admin password123; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      mc mb myminio/warehouse || true;
      mc mb myminio/mlflow-artifacts || true;
      mc policy set public myminio/warehouse;
      mc policy set public myminio/mlflow-artifacts;
      echo 'MinIO buckets created successfully';
      exit 0;
      "

  # ==================== POSTGRES (Metastore & MLflow) ====================
  postgres:
    image: postgres:14-alpine
    hostname: postgres
    container_name: postgres
    networks:
      - financial-streaming
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: metastore_db
      POSTGRES_MULTIPLE_DATABASES: mlflow_db,superset_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init/create-databases.sh:/docker-entrypoint-initdb.d/init-db.sh
      - ./postgres-init/init-hive.sql:/docker-entrypoint-initdb.d/init-hive.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== FLINK JOB MANAGER ====================
  flink-jobmanager:
    image: flink:1.17.2-scala_2.12-java11
    hostname: flink-jobmanager
    container_name: flink-jobmanager
    networks:
      - financial-streaming
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        state.backend: rocksdb
        state.checkpoints.dir: file:///tmp/flink-checkpoints
        state.savepoints.dir: file:///tmp/flink-savepoints
    volumes:
      - ./flink-jobs/target:/opt/flink/usrlib
      - iceberg-warehouse:/tmp/iceberg
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== FLINK TASK MANAGER ====================
  flink-taskmanager:
    image: flink:1.17.2-scala_2.12-java11
    hostname: flink-taskmanager
    container_name: flink-taskmanager
    networks:
      - financial-streaming
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 2048m
    volumes:
      - ./flink-jobs/target:/opt/flink/usrlib
      - iceberg-warehouse:/tmp/iceberg



  # ==================== TRINO ====================
  trino:
    image: trinodb/trino:428
    hostname: trino
    container_name: trino
    networks:
      - financial-streaming
    ports:
      - "8082:8080"
    volumes:
      - ./trino-config:/etc/trino
      - ./trino-jdbc/postgresql-42.7.3.jar:/usr/lib/trino/lib/postgresql.jar
    deploy:
      resources:
        limits:
          memory: 4GB
        reservations:
          memory: 2GB
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==================== MLFLOW ====================
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    container_name: mlflow-server
    networks:
      - financial-streaming
    ports:
      - "5000:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://admin:password123@postgres:5432/mlflow_db
      MLFLOW_ARTIFACT_ROOT: s3://mlflow-artifacts
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password123
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: sh -c "pip install psycopg2-binary boto3 && mlflow server --host 0.0.0.0 --port 5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/2.0/mlflow/experiments/list"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ==================== SUPERSET ====================
  superset:
    image: apache/superset:3.0.0
    hostname: superset
    container_name: superset
    networks:
      - financial-streaming
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: 'thisissecretkey123changeinproduction'
      SUPERSET_LOAD_EXAMPLES: 'no'
      DATABASE_DB: superset_db
      DATABASE_HOST: postgres
      DATABASE_PASSWORD: password123
      DATABASE_USER: admin
      DATABASE_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
      trino:
        condition: service_healthy
    volumes:
      - ./superset-config:/app/pythonpath
    command: >
      sh -c "
      superset db upgrade &&
      superset fab create-admin --username admin --firstname Admin --lastname User --email admin@superset.com --password admin || true &&
      superset init &&
      /usr/bin/run-server.sh
      "

  # ==================== GRAFANA ====================
  grafana:
    image: grafana/grafana:10.2.0
    hostname: grafana
    container_name: grafana
    networks:
      - financial-streaming
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - ./grafana-config:/etc/grafana/provisioning
