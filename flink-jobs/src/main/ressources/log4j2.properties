# Configuration Log4j2 pour Flink

rootLogger.level = INFO
rootLogger.appenderRef.console.ref = ConsoleAppender

# Console Appender
appender.console.name = ConsoleAppender
appender.console.type = CONSOLE
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n

# Supprimer les logs verbeux de certaines librairies
logger.akka.name = akka
logger.akka.level = WARN

logger.kafka.name = org.apache.kafka
logger.kafka.level = WARN

logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = WARN

logger.zookeeper.name = org.apache.zookeeper
logger.zookeeper.level = WARN

logger.hive.name = org.apache.hive
logger.hive.level = WARN

logger.netty.name = io.netty
logger.netty.level = WARN

# Logs Flink
logger.flink.name = org.apache.flink
logger.flink.level = INFO

# Logs Iceberg
logger.iceberg.name = org.apache.iceberg
logger.iceberg.level = INFO

# Logs de notre application
logger.finance.name = com.finance.streaming
logger.finance.level = INFO

# File Appender (optionnel)
appender.file.name = FileAppender
appender.file.type = RollingFile
appender.file.fileName = logs/flink-app.log
appender.file.filePattern = logs/flink-app-%d{yyyy-MM-dd}-%i.log.gz
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n
appender.file.policies.type = Policies
appender.file.policies.time.type = TimeBasedTriggeringPolicy
appender.file.policies.time.interval = 1
appender.file.policies.size.type = SizeBasedTriggeringPolicy
appender.file.policies.size.size = 100MB
appender.file.strategy.type = DefaultRolloverStrategy
appender.file.strategy.max = 10